# systemd settings merged into the comfyui service by comfy/limits.sh on.
# These only rank ComfyUI against other processes *inside* WSL; Windows sees the VM as one process.
[Service]
Nice=10
CPUWeight=20
IOWeight=20
# #63: ROCm's allocator fragments VRAM during Qwen's VAE decode ("HSA exception: MemoryRegion::BlockAllocator::alloc
# failed" killed the worker once). Expandable segments let PyTorch grow blocks instead of needing one big free one.
Environment=PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
# #63: a soft ceiling for ComfyUI inside WSL (WSL has ~23.5 GB). Above it the kernel reclaims/throttles ComfyUI instead
# of letting it take the last RAM Windows needs. Not a kill limit. Raise it if jobs get much slower, or drop the line.
MemoryHigh=21G
