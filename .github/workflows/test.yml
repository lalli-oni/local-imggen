name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04  # same Ubuntu as tulu's WSL
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Ubuntu 24.04's python3, as on tulu
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install test dependencies (never torch)
        run: |
          pip install -r requirements-dev.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: ./test.sh
        env:
          IMAGEGEN_TEST_PYTHON: python
          IMAGEGEN_REQUIRE_BROWSER: "1"
        run: ./test.sh
