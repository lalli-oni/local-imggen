# imagegen config. Edit freely; changes apply on the next run.
# Env overrides for one-off runs: IMAGEGEN_OUTPUT_DIR, IMAGEGEN_COMFY_URL

comfy_url  = "http://127.0.0.1:8188"
output_dir = "/mnt/c/Users/lalli/Pictures/imagegen"   # change this line to move outputs

checkpoint       = "sd_xl_base_1.0.safetensors"
default_negative = "blurry, low quality, watermark, text, signature, jpeg artifacts"

# Each preset = a workflow template in workflows/ + the values poured into it. `model` names the model for
# people (the gen bakeoff labels).
# Keys a workflow uses as "{{key}}" must exist here (or come from CLI/MCP args).

[presets.draft]
description = "Quick square SDXL image for ideas and exploration"
model = "SDXL base 1.0"
ref_preset = "sdxl_ref"         # what draws with a ref image (gen bakeoff --t2i's ref test)
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 25
cfg = 7.0
suffix = ""

# Wallpapers use Qwen-Image 2.1 since the #51 bake-off (best quality and on-model refs; ~3 min an image).
# Keep the resource limits on (comfy/limits.sh on): without them a Qwen run can stall Windows.
# The SDXL versions are wallpaper_sdxl / wallpaper_ultrawide_sdxl (fast, and they have gen vary graphs).
[presets.wallpaper]
description = "16:9 landscape, upscaled to 4K (3840x2160) (Qwen-Image 2.1)"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024
steps = 25
cfg = 1.0
width = 1536                     # exactly 16:9 (multiples of 16), so the 4K scale crops nothing
height = 864
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"

[presets.wallpaper_ultrawide]
description = "21:9 ultrawide, upscaled to 3440x1440 (Qwen-Image 2.1)"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024
steps = 25
cfg = 1.0
width = 1792                     # 21:9
height = 768
target_width = 3440
target_height = 1440
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", ultrawide panoramic wallpaper, highly detailed"

[presets.wallpaper_sdxl]
description = "16:9 landscape, upscaled to 4K (3840x2160) (SDXL: fast)"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "SDXL base 1.0"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1344
height = 768
steps = 30
cfg = 7.0
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"

[presets.wallpaper_ultrawide_sdxl]
description = "21:9 ultrawide, upscaled to 3440x1440 (SDXL: fast)"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "SDXL base 1.0"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1536
height = 640
steps = 30
cfg = 7.0
target_width = 3440
target_height = 1440
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", ultrawide panoramic wallpaper, highly detailed"

[presets.icon]
description = "Single centered icon, background removed -> transparent PNG"
model = "SDXL base 1.0"
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 30
cfg = 7.0
suffix = ", app icon, single centered object, isolated on a plain pure white background, flat vector style, bold simple shapes, no shadow, no scenery"
negative_extra = ", busy background, multiple objects, photo, text, letters, frame, border, scattered elements, confetti, drop shadow, cast shadow, vignette, scenery, ground, gradient background, patterned background"
# remove_bg: rembg cut-out. keep_largest: drop stray shapes around the subject (anything under a
# quarter of its size). trim: crop to the subject, centre it on a square (the canvas's shorter side).
post = ["remove_bg", "keep_largest", "trim"]

# Styles (#10): a named look, added to the prompt after the preset's suffix. A preset's `styles` are its
# default; `gen "..." --style NAME` (repeatable, or --style none) replaces them, `gen styles` lists them.
# Projects copy one into a snippet (gen project set SLUG --snippet style=@synthwave), so a later change here
# doesn't silently change a project. Qwen runs at cfg 1, so negative_extra only reaches the SDXL presets.
[styles.synthwave]
description = "The house look: synthwave/vaporwave magical realism, realistic yet outrageous and funny"
suffix = "synthwave vaporwave magical realism, a detailed realistic digital painting of an outrageous, over-the-top and funny scene, like a still from an 80s action movie, set in the 1980s, indoor rooms with 80s interiors like shag pile carpet, wood-panelled walls, waterbeds and rattan furniture, glowing pink, magenta and cyan neon accents from signs and lamps, retro 80s sunset colours, chrome and wet reflective surfaces, several funny sight gags spread through the scene with room to breathe between them, cinematic lighting, rich saturated colours"
negative_extra = "flat cartoon, childish storybook, washed out colours, dull grey lighting"

# Þór's first direction to explore (2026-11-17): 80s/90s digital artefacts as a playful mood, a digital world
# where anything is possible. The screen look itself (scanlines, softness, colour bleed, warmth) is the crt post
# step below, not the prompt: Qwen drew thin, crisp lines and random RGB glitch blocks when asked for them.
# Mix it in: gen "..." --style synthwave,retro_digital ([daily] uses both).
[styles.retro_digital]
description = "80s/90s digital world: pixel-art screens, chrome, and the crt post step (soft scanlines, VHS warmth)"
suffix = "a playful 80s and 90s digital world where anything is possible, chunky pixel-art graphics on screens and signs, shiny chrome, a clean image"
post = ["crt"]                # a style's post steps run after the preset's

# The crt post step (gen crt IMAGE... tries other values on finished images, without generating again).
# Sizes are for a 1080-line image and scale with it (a 4K wallpaper gets twice the px).
[crt]
lines = 360        # scanlines over the image height (fewer = thicker, further apart; old TVs had ~480)
scanline = 0.22    # how dark the gaps between lines get, 0-1 (0 = no lines)
blur = 0.6         # softness in px
bleed = 1.0        # red/blue colour fringes sideways in px, like VHS
glow = 0.2         # bright parts bloom into their surroundings, 0-1
warmth = 0.04      # a bit more red, less blue, 0-0.2
vignette = 0.18    # darker corners, 0-1

[styles.storybook]
description = "The old daily look: cosy, soft, whimsical"
suffix = "cosy whimsical storybook scene, soft light"

# gen daily (#3): one new wallpaper a day, set as the desktop background (old ones stay in output_dir).
# Schedule it: windows/daily-task.sh on [--at 06:00]. Preview a day: gen daily --show [--date 2026-12-24].
# Log: <output_dir>/daily.log. Themes are picked at random from the ones not used recently.
[daily]
# wallpaper_cast (#52): Qwen draws the scene with a stand-in per cast character, then a Qwen edit replaces each
# stand-in with the character from its ref image, so the cast is part of the scene (~2x a wallpaper's time).
# "wallpaper_ref" = the older way (the first ref redrawn into a scene); "wallpaper" = Qwen from text only.
preset = "wallpaper_cast"
ref = ""                      # CHARACTER:REF or an image path (relative = under output_dir), or a list of them (one per
                              # character, wallpaper_cast); "" = each cast character's first ref
# wallpaper_cast: the scene pass's prompt ({stand_ins}, {scene} = theme + a literal style; named styles are added
# by the preset) and the cast pass's edit ({replace} = "Replace the main character in image 1 with the
# character from image 2."). "" = the built-in ones in daily.py. stand_in = "" draws the scene empty and
# the edit adds the characters instead.
scene_prompt = ""
stand_in = "a small cute cartoon creature"
cast_prompt = ""
# wallpaper_ref only:
# With a ref, the prompt is this ({scene} = theme + style, {name} = the cast character); the cast descriptions
# are left out (they ask for a plain white background, so the model copied the ref as-is).
# The character is part of the action (#52: blended into the scene, not posing in the middle). Other creatures
# are fine (crab armies, flamingo guards), as long as they don't look like a second copy of the character.
ref_prompt = "A wide, finished wallpaper image that fills the whole frame: {scene}. The only text in the image is the sign text named in the scene, spelled exactly as given; no other signs, labels or writing. Detailed background, scenery and lighting everywhere, no white or empty background, no border. The character from the reference image appears exactly once, as {name}: busy with the action as part of the scene, not posing in the centre, lit like the rest of the scene, in a new pose, with the same design and colours and its short rounded tail. Any other creatures look clearly different from {name}."
count = 1                     # images per day; the first one becomes the wallpaper
no_repeat_days = 7            # at least this many days between two uses of a theme (past daily runs)
cast = ["tulu"]               # characters (gen char) in every daily; their descriptions lead the prompt
style = "synthwave, retro_digital"  # [styles] names, or a phrase of literal text; "" = the preset's styles
# Missions, absurd set pieces and a punny sign each. Give a sign's exact text in quotes (Qwen writes gibberish
# on signs it makes up), and ref_prompt asks for no other text. The house style is outrageous and funny.
themes = [
  "on a midnight heist in a neon casino vault, dodging pink laser beams while flamingo guards snooze, a neon sign reads 'SQUID PRO QUO'",
  "racing a chrome speedboat through a flooded neon Miami at sunset, chased by a giant inflatable rubber duck, a billboard reads 'TIDE WAITS FOR NO ONE'",
  "running a taco truck on the moon for a long queue of astronauts, Earth rising behind, a neon sign reads 'OUT OF THIS WORLD TACOS'",
  "teaching a sold-out aerobics class to retired sea monsters in leg warmers and headbands, a neon sign reads 'TENTACLE TONE-UP'",
  "defending a shopping mall food court from an army of wind-up toy crabs with a leaf blower, a sign reads 'NO REFUNDS, ONLY CRABS'",
  "singing a power ballad at a karaoke bar inside a submarine, a disco ball and bubbles everywhere, a neon sign reads 'CALAMARI KARAOKE, NO CALAMARI SERVED'",
  "cruising a palm-lined boulevard at sunset in a lowrider shaped like a giant sardine tin, a billboard reads 'CAN'T STOP, WON'T STOP'",
  "washing a seaweed-covered stretch limo at a neon car wash, a sign reads 'ELDRITCH CAR WASH, WE CLEAN THE UNSPEAKABLE'",
  "selling a haunted sunken mansion as an over-eager estate agent with a clipboard, a sign reads 'DEEP ONE REAL ESTATE, DEEP DISCOUNTS'",
  "snowboarding down an Icelandic glacier chased by puffins on jet skis, neon northern lights in the sky, a hut sign reads 'NO PUFFIN ALLOWED'",
  "floating on a neon pool flamingo in a steaming Icelandic hot spring while a volcano erupts fireworks behind, a sign reads 'HOT TUB, HOTTER LAVA'",
  "driving a yellow Lisbon tram rebuilt as a hot rod down a steep street, glowing azulejo tiles, a tram sign reads 'NEXT STOP: VICTORY'",
  "steering a Viking longship with neon sails through Nyhavn in Copenhagen, the colourful houses lit like an arcade, a banner reads 'HYGGE OR DIE TRYING'",
  "paragliding past Angel Falls in Venezuela on a giant inflatable flamingo, misty tepuis glowing at sunset, a sign reads 'FALL IN LOVE'",
  "arm-wrestling an octopus at an underwater championship, a crowd of fish waving neon foam fingers, a banner reads 'EIGHT ARMS, NO MERCY'",
  "DJing a beach rave for dancing jellyfish from a booth built out of old arcade cabinets, a neon sign reads 'SEA YOU ON THE DANCE FLOOR'",
  "escaping a laser-grid museum with the world's largest pearl while lobster security guards blow whistles, a sign reads 'PLEASE DO NOT TOUCH THE EXHIBITS'",
  "walking away in slow motion with sunglasses on from a huge fireworks explosion at a sushi bar, a sign reads 'SUSHI? NEVER HEARD OF HER'",
  "fixing a giant retro robot in a neon garage while it sips motor oil from a milkshake glass, a sign reads 'OIL BE BACK'",
  "captaining a pirate submarine shaped like a rubber duck through a neon coral reef, a glowing treasure map on the dashboard, a sign reads 'DUCK AND COVER'",
  "riding a mechanical bull in a cowboy hat at a neon rodeo for sea creatures, a sign reads 'HOLD YOUR SEAHORSES'",
  "running a fancy hair salon for sea monsters, a kraken in curlers under a chrome hair dryer, a neon sign reads 'CURL UP AND DYE'",
  "bowling with a giant pearl in a cosmic bowling alley on a space station, Earth glowing outside the window, a sign reads 'STRIKE FROM THE DEEP'",
  "delivering pizza on roller skates through a rainy neon city, pizza boxes stacked to the sky, a sign reads 'HOT IN 30 TENTACLES OR LESS'",
]

