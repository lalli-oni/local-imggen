# imagegen config. Edit freely; changes apply on the next run.
# Env overrides for one-off runs: IMAGEGEN_OUTPUT_DIR, IMAGEGEN_COMFY_URL

comfy_url  = "http://127.0.0.1:8188"
output_dir = "/mnt/c/Users/lalli/Pictures/imagegen"   # change this line to move outputs

checkpoint       = "sd_xl_base_1.0.safetensors"
default_negative = "blurry, low quality, watermark, text, signature, jpeg artifacts"

# Each preset = a workflow template in workflows/ + the values poured into it.
# Keys a workflow uses as "{{key}}" must exist here (or come from CLI/MCP args).

[presets.draft]
description = "Quick square SDXL image for ideas and exploration"
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 25
cfg = 7.0
suffix = ""

[presets.wallpaper]
description = "16:9 landscape, upscaled to 4K (3840x2160)"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1344
height = 768
steps = 30
cfg = 7.0
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"

[presets.wallpaper_ultrawide]
description = "21:9 ultrawide, upscaled to 3440x1440"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1536
height = 640
steps = 30
cfg = 7.0
target_width = 3440
target_height = 1440
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", ultrawide panoramic wallpaper, highly detailed"

[presets.icon]
description = "Single centered icon, background removed -> transparent PNG"
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 30
cfg = 7.0
suffix = ", app icon, single centered object, isolated on a plain pure white background, flat vector style, bold simple shapes, no shadow, no scenery"
negative_extra = ", busy background, multiple objects, photo, text, letters, frame, border, scattered elements, confetti, drop shadow, cast shadow, vignette, scenery, ground, gradient background, patterned background"
# remove_bg: rembg cut-out. keep_largest: drop stray shapes around the subject (anything under a
# quarter of its size). trim: crop to the subject, centre it on a square (the canvas's shorter side).
post = ["remove_bg", "keep_largest", "trim"]

# gen daily (#3): one new wallpaper a day, set as the desktop background (old ones stay in output_dir).
# Schedule it: windows/daily-task.sh on [--at 06:00]. Preview a day: gen daily --show [--date 2026-12-24].
# Log: <output_dir>/daily.log. Themes are picked at random from the ones not used recently.
[daily]
preset = "wallpaper"          # or wallpaper_ultrawide
count = 1                     # images per day; the first one becomes the wallpaper
no_repeat_days = 7            # at least this many days between two uses of a theme (past daily runs)
cast = ["tulu"]               # characters (gen char) in every daily; their descriptions lead the prompt
style = "cosy whimsical storybook scene, soft light"
themes = [
  "relaxing in a tide pool at sunset, wide rocky coastline",
  "reading a book in a cosy window nook on a rainy day",
  "floating among glowing jellyfish in the deep blue sea",
  "sipping tea on a mossy rock in a misty pine forest",
  "stargazing on a grassy hill under the northern lights",
  "surfing a small wave on a sunny tropical beach",
  "napping on a lighthouse balcony at dawn",
  "exploring a sunken ship full of treasure",
  "building a sandcastle shaped like a sunken city",
  "tending a tiny coral garden on the sea floor",
]

# Optional: replaces `themes` for a month (jan..dec) or a weekday (mon..sun); a month wins over a weekday.
[daily.months]
oct = ["carving a jack-o'-lantern in a pumpkin patch at dusk", "trick-or-treating through a foggy harbour town",
       "brewing a bubbling potion in a candlelit sea cave"]
dec = ["sledding down a snowy hill under twinkling lights", "decorating a kelp tree with glowing ornaments",
       "drinking hot cocoa by a fireplace on a snowy night"]

[daily.weekdays]
# fri = "partying in a neon-lit underwater disco"

# Opt-in model presets: `download` names the script in models/ that fetches their models (gen doctor
# shows them as warn until then). Presets that load a diffusion model (`unet`) have no img2img/inpaint
# (gen vary) unless they name an img2img_workflow / inpaint_workflow.

# Edit-only preset: `gen edit IMAGE "instruction"` / MCP edit. Not usable for gen "prompt" or gen vary.
# Models are opt-in (~17.7 GB): run ~/imagegen/models/flux-kontext.sh once.
# FLUX.1 Kontext [dev] is under the FLUX.1 [dev] non-commercial licence.
[presets.kontext]
description = "Edit an image by instruction (FLUX.1 Kontext dev, fp8): gen edit IMAGE \"...\""
edit_workflow = "flux_kontext.json"
download = "flux-kontext.sh"
unet = "flux1-dev-kontext_fp8_scaled.safetensors"
clip_l = "clip_l.safetensors"
t5 = "t5xxl_fp8_e4m3fn_scaled.safetensors"
vae = "ae.safetensors"
steps = 20
guidance = 2.5

# Bake-off candidates (#40): text-to-image and edit in one preset each. Compare with `gen bakeoff`.
# FLUX.2 [klein] 4B distilled, fp8 (~11.9 GB, Apache 2.0): ~/imagegen/models/flux2-klein.sh
[presets.klein]
description = "FLUX.2 klein 4B (fp8, 4 steps): text-to-image, and gen edit IMAGE \"...\" -p klein"
workflow = "flux2_klein_t2i.json"
edit_workflow = "flux2_klein_edit.json"
download = "flux2-klein.sh"
unet = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"
width = 1024
height = 1024
steps = 4

# Qwen-Image-2.1 7B (~30 GB of bf16 files, Qwen Research licence): ~/imagegen/models/qwen-image-2.1.sh
# weight_dtype loads the bf16 diffusion model as fp8 (half the VRAM). Not int8: int8 renders black here.
# resolution = the edit's pixel budget (1024 = ~1 MP; the model goes up to 2048). cfg 1 ignores the negative.
[presets.qwen]
description = "Qwen-Image-2.1 7B (fp8 at load): text-to-image, and gen edit IMAGE \"...\" -p qwen"
workflow = "qwen_image_21_t2i.json"
edit_workflow = "qwen_image_21_edit.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
width = 1024
height = 1024
resolution = 1024
steps = 25
cfg = 1.0
