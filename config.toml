# imagegen config. Edit freely; changes apply on the next run.
# Env overrides for one-off runs: IMAGEGEN_OUTPUT_DIR, IMAGEGEN_COMFY_URL

comfy_url  = "http://127.0.0.1:8188"
output_dir = "/mnt/c/Users/lalli/Pictures/imagegen"   # change this line to move outputs

checkpoint       = "sd_xl_base_1.0.safetensors"
default_negative = "blurry, low quality, watermark, text, signature, jpeg artifacts"

# Each preset = a workflow template in workflows/ + the values poured into it. `model` names the model for
# people (the gen bakeoff labels).
# Keys a workflow uses as "{{key}}" must exist here (or come from CLI/MCP args).

[presets.draft]
description = "Quick square SDXL image for ideas and exploration"
model = "SDXL base 1.0"
ref_preset = "sdxl_ref"         # what draws with a ref image (gen bakeoff --t2i's ref test)
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 25
cfg = 7.0
suffix = ""

# Wallpapers use Qwen-Image 2.1 since the #51 bake-off (best quality and on-model refs; ~3 min an image).
# Keep the resource limits on (comfy/limits.sh on): without them a Qwen run can stall Windows.
# The SDXL versions are wallpaper_sdxl / wallpaper_ultrawide_sdxl (fast, and they have gen vary graphs).
[presets.wallpaper]
description = "16:9 landscape, upscaled to 4K (3840x2160) (Qwen-Image 2.1)"
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024
steps = 25
cfg = 1.0
width = 1536                     # exactly 16:9 (multiples of 16), so the 4K scale crops nothing
height = 864
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"

[presets.wallpaper_ultrawide]
description = "21:9 ultrawide, upscaled to 3440x1440 (Qwen-Image 2.1)"
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024
steps = 25
cfg = 1.0
width = 1792                     # 21:9
height = 768
target_width = 3440
target_height = 1440
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", ultrawide panoramic wallpaper, highly detailed"

[presets.wallpaper_sdxl]
description = "16:9 landscape, upscaled to 4K (3840x2160) (SDXL: fast)"
model = "SDXL base 1.0"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1344
height = 768
steps = 30
cfg = 7.0
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"

[presets.wallpaper_ultrawide_sdxl]
description = "21:9 ultrawide, upscaled to 3440x1440 (SDXL: fast)"
model = "SDXL base 1.0"
workflow = "sdxl_upscale.json"
img2img_workflow = "sdxl_img2img_upscale.json"
inpaint_workflow = "sdxl_inpaint_upscale.json"
width = 1536
height = 640
steps = 30
cfg = 7.0
target_width = 3440
target_height = 1440
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", ultrawide panoramic wallpaper, highly detailed"

[presets.icon]
description = "Single centered icon, background removed -> transparent PNG"
model = "SDXL base 1.0"
workflow = "sdxl_base.json"
width = 1024
height = 1024
steps = 30
cfg = 7.0
suffix = ", app icon, single centered object, isolated on a plain pure white background, flat vector style, bold simple shapes, no shadow, no scenery"
negative_extra = ", busy background, multiple objects, photo, text, letters, frame, border, scattered elements, confetti, drop shadow, cast shadow, vignette, scenery, ground, gradient background, patterned background"
# remove_bg: rembg cut-out. keep_largest: drop stray shapes around the subject (anything under a
# quarter of its size). trim: crop to the subject, centre it on a square (the canvas's shorter side).
post = ["remove_bg", "keep_largest", "trim"]

# gen daily (#3): one new wallpaper a day, set as the desktop background (old ones stay in output_dir).
# Schedule it: windows/daily-task.sh on [--at 06:00]. Preview a day: gen daily --show [--date 2026-12-24].
# Log: <output_dir>/daily.log. Themes are picked at random from the ones not used recently.
[daily]
preset = "wallpaper_ref"      # Qwen + the cast's ref image (on-model); "wallpaper" = Qwen from text only
ref = ""                      # CHARACTER:REF, or an image path (relative = under output_dir); "" = first cast character's first ref
# With a ref, the prompt is this ({scene} = theme + style, {name} = the cast character); the cast descriptions
# are left out (they ask for a plain white background, so the model copied the ref as-is).
ref_prompt = "A wide, finished storybook illustration that fills the whole frame: {scene}. Detailed background, scenery and lighting everywhere, no white or empty background, no border. The character from the reference image appears exactly once, as {name}, in a new pose that fits the scene, with the same design and colours and its short rounded tail. No other characters."
count = 1                     # images per day; the first one becomes the wallpaper
no_repeat_days = 7            # at least this many days between two uses of a theme (past daily runs)
cast = ["tulu"]               # characters (gen char) in every daily; their descriptions lead the prompt
style = "cosy whimsical storybook scene, soft light"
themes = [
  "relaxing in a tide pool at sunset, wide rocky coastline",
  "reading a book in a cosy window nook on a rainy day",
  "floating among glowing jellyfish in the deep blue sea",
  "sipping tea on a mossy rock in a misty pine forest",
  "stargazing on a grassy hill under the northern lights",
  "surfing a small wave on a sunny tropical beach",
  "napping on a lighthouse balcony at dawn",
  "exploring a sunken ship full of treasure",
  "building a sandcastle shaped like a sunken city",
  "tending a tiny coral garden on the sea floor",
  "watching puffins on a grassy sea cliff in Iceland",
  "soaking in a steaming hot spring among Icelandic lava fields",
  "cycling past the colourful old houses of Nyhavn in Copenhagen",
  "riding a yellow Lisbon tram past blue azulejo-tiled houses",
  "gazing at Angel Falls from a misty tepui in Venezuela",
]

# Optional: replaces `themes` on a day. The most specific entry wins: "YYYY-MM-DD", "MM-DD", month, weekday.
# Movable feasts (Easter-based, Þorri) change date every year: add them as "YYYY-MM-DD", one year at a time.
[daily.dates]
"01-06" = "at an Icelandic Þrettándinn bonfire on Twelfth Night, elves dancing in the snow"
"04-25" = "holding red carnations at a joyful street celebration in Lisbon"
"05-04" = "as a space-opera hero with a glowing laser sword, starships and twin suns in the sky"
"06-05" = "having a picnic under little Danish flags on Constitution Day"
"06-10" = "celebrating Dia de Portugal on a sunny harbour in the Algarve"
"06-13" = "grilling sardines at a Santo António street party in Lisbon, pots of basil and paper garlands"
"06-17" = "waving a small Icelandic flag at a 17 June parade in Reykjavík, balloons and colourful houses"
"06-23" = "by a Sankt Hans midsummer bonfire on a Danish beach in the late evening light"
"06-24" = ["at the São João festival in Porto with a plastic hammer, balloons and fireworks over the river",
           "drumming at the San Juan drum festival on a palm-lined Venezuelan coast"]
"07-05" = "celebrating Venezuelan Independence Day with yellow, blue and red flags below Mount Ávila"
"10-12" = "at the María Lionza gathering on Sorte mountain in Venezuela, candles, drums and mist in the jungle night"
"11-10" = "at a cosy Danish Mortens aften dinner with roast duck and candles"
"11-11" = "roasting chestnuts at a São Martinho magusto bonfire in a Portuguese village"
"11-18" = "playing a cuatro at a lively gaita party in Maracaibo"
"12-24" = ["dancing around a Danish Christmas tree with risalamande on the table",
           "sharing hallacas and pan de jamón at a Venezuelan Christmas Eve feast"]
"12-31" = "jumping off a chair at midnight on Danish New Year's Eve, fireworks over Copenhagen"
"2027-01-22" = "at an Icelandic Þorrablót feast with hákarl, rye bread and singing"
"2027-02-07" = "in a costume at Danish Fastelavn, hitting a candy barrel with a bat"
"2027-05-27" = "dancing with the Diablos Danzantes de Yare in a red devil costume and painted mask, Corpus Christi in Venezuela"
"2027-11-05" = "on Danish J-dag, the evening the Christmas beer arrives, a snowy pub street full of blue Santa hats"
"2027-02-08" = ["handing out cream buns on Icelandic Bolludagur", "dancing in the Carnaval parade of El Callao, Venezuela"]

[daily.months]
oct = ["carving a jack-o'-lantern in a pumpkin patch at dusk", "trick-or-treating through a foggy harbour town",
       "brewing a bubbling potion in a candlelit sea cave"]
dec = ["sledding down a snowy hill under twinkling lights", "decorating a kelp tree with glowing ornaments",
       "drinking hot cocoa by a fireplace on a snowy night",
       "meeting the Icelandic Yule Lads on a snowy turf-roofed farm"]

[daily.weekdays]
# fri = "partying in a neon-lit underwater disco"

# Opt-in model presets: `download` names the script in models/ that fetches their models (gen doctor
# shows them as warn until then). Presets that load a diffusion model (`unet`) have no img2img/inpaint
# (gen vary) unless they name an img2img_workflow / inpaint_workflow.

# SDXL finetune for the text-to-image bake-off (#51). One checkpoint file, so no new nodes.
# Models are opt-in (~6.9 GB, CreativeML Open RAIL++-M): run ~/imagegen/models/dreamshaper-xl-lightning.sh once.
# Lightning is distilled: 4-8 steps at cfg ~2 with DPM++ SDE Karras. gen vary on it uses the SDXL img2img graph
# (dpmpp_2m), which is not what Lightning is tuned for.
[presets.dreamshaper]
description = "DreamShaper XL Lightning (SDXL finetune, 6 steps): illustration-friendly, natural-language prompts"
model = "DreamShaper XL Lightning"
ref_preset = "dreamshaper_ref"
workflow = "sdxl_lightning.json"
download = "dreamshaper-xl-lightning.sh"
checkpoint = "DreamShaperXL_Lightning.safetensors"
width = 1024
height = 1024
steps = 6
cfg = 2.0
suffix = ""

# SDXL + IP-Adapter (#51): an SDXL model draws the character in a ref image into a new scene. Edit-only
# (gen edit REF "scene" -p sdxl_ref); `ref_preset` on draft/dreamshaper points the bake-off's ref test here.
# Opt-in: ~/imagegen/models/ipadapter-sdxl.sh (~3.4 GB) + the ComfyUI_IPAdapter_plus node (see that script).
# ipadapter_weight: how strongly the ref steers (higher = closer to the ref, less to the prompt).
# ipadapter_end: the share of the steps it steers; the rest follow the prompt alone, so the scene can take over.
# First tulu run (0.8, whole run): SDXL copied the ref's white sticker background and drew no scene.
[presets.sdxl_ref]
description = "SDXL base + IP-Adapter: the character in a ref image in a new scene: gen edit REF \"scene\" -p sdxl_ref"
model = "SDXL base 1.0 + IP-Adapter"
edit_workflow = "sdxl_ipadapter.json"
download = "ipadapter-sdxl.sh"
checkpoint = "sd_xl_base_1.0.safetensors"
ipadapter_model = "ip-adapter-plus_sdxl_vit-h.safetensors"
clip_vision = "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
ipadapter_weight = 0.55
ipadapter_end = 0.7
ref_negative = "white background, plain background, simple background, isolated, sticker, border, blurry, low quality, watermark, text, multiple characters"
steps = 25
cfg = 7.0

[presets.dreamshaper_ref]
description = "DreamShaper XL Lightning + IP-Adapter: gen edit REF \"scene\" -p dreamshaper_ref"
model = "DreamShaper XL Lightning + IP-Adapter"
edit_workflow = "sdxl_lightning_ipadapter.json"
download = "ipadapter-sdxl.sh"
checkpoint = "DreamShaperXL_Lightning.safetensors"
ipadapter_model = "ip-adapter-plus_sdxl_vit-h.safetensors"
clip_vision = "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
ipadapter_weight = 0.55
ipadapter_end = 0.7
ref_negative = "white background, plain background, simple background, isolated, sticker, border, blurry, low quality, watermark, text, multiple characters"
steps = 6
cfg = 2.0

# Edit-only preset: `gen edit IMAGE "instruction"` / MCP edit. Not usable for gen "prompt" or gen vary.
# Models are opt-in (~17.7 GB): run ~/imagegen/models/flux-kontext.sh once.
# FLUX.1 Kontext [dev] is under the FLUX.1 [dev] non-commercial licence.
[presets.kontext]
description = "Edit an image by instruction (FLUX.1 Kontext dev, fp8): gen edit IMAGE \"...\""
model = "FLUX.1 Kontext dev"
edit_workflow = "flux_kontext.json"
download = "flux-kontext.sh"
unet = "flux1-dev-kontext_fp8_scaled.safetensors"
clip_l = "clip_l.safetensors"
t5 = "t5xxl_fp8_e4m3fn_scaled.safetensors"
vae = "ae.safetensors"
steps = 20
guidance = 2.5

# Bake-off candidates (#40): text-to-image and edit in one preset each. Compare with `gen bakeoff`.
# FLUX.2 [klein] 4B distilled, fp8 (~11.9 GB, Apache 2.0): ~/imagegen/models/flux2-klein.sh
[presets.klein]
description = "FLUX.2 klein 4B (fp8, 4 steps): text-to-image, and gen edit IMAGE \"...\" -p klein"
model = "FLUX.2 klein 4B"
workflow = "flux2_klein_t2i.json"
edit_workflow = "flux2_klein_edit.json"
download = "flux2-klein.sh"
unet = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"
width = 1024
height = 1024
steps = 4

# A 16:9 4K wallpaper that draws the character from a reference image (klein models, as above). The scene
# comes from the prompt; the ref only shows the character, so it stays on-model. gen daily uses it.
# By hand: gen edit REF.png "lil tulu reading in a rainy window nook, only one character" -p wallpaper_ref
[presets.wallpaper_ref]
description = "16:9 wallpaper (4K) of the character in a ref image (Qwen-Image 2.1): gen edit REF \"scene\" -p wallpaper_ref"
model = "Qwen-Image 2.1"
edit_workflow = "qwen_image_21_ref_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024              # pixel budget for the ref image
steps = 25
cfg = 1.0
out_width = 1536                # exactly 16:9 (and multiples of 16), so the 4K scale crops nothing
out_height = 864
upscale_model = "RealESRGAN_x4plus.pth"
target_width = 3840
target_height = 2160

# The daily wallpaper before #51: klein draws the ref's character (~20 s, but less polished than Qwen).
[presets.wallpaper_ref_klein]
description = "16:9 wallpaper (4K) of the character in a ref image (FLUX.2 klein: fast): gen edit REF \"scene\" -p wallpaper_ref_klein"
model = "FLUX.2 klein 4B"
edit_workflow = "flux2_klein_ref_upscale.json"
download = "flux2-klein.sh"
unet = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"
out_width = 1536                # exactly 16:9 (and multiples of 16), so the 4K scale crops nothing
out_height = 864
steps = 16                      # klein is tuned for 4, but 16 gave far fewer quirks on tulu (8: many small ones)
upscale_model = "RealESRGAN_x4plus.pth"
target_width = 3840
target_height = 2160

# Qwen-Image-2.1 7B (~30 GB of bf16 files, Qwen Research licence): ~/imagegen/models/qwen-image-2.1.sh
# weight_dtype loads the bf16 diffusion model as fp8 (half the VRAM). Not int8: int8 renders black here.
# resolution = the edit's pixel budget (1024 = ~1 MP; the model goes up to 2048). cfg 1 ignores the negative.
[presets.qwen]
description = "Qwen-Image-2.1 7B (fp8 at load): text-to-image, and gen edit IMAGE \"...\" -p qwen"
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_t2i.json"
edit_workflow = "qwen_image_21_edit.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
width = 1024
height = 1024
resolution = 1024
steps = 25
cfg = 1.0

# #51: the same model with the fp8 Qwen3-VL text encoder (10.6 GB instead of 16 GB), so it fits in WSL's RAM
# without swapping (the bf16 one locked up Windows during a video). Becomes `qwen` if the bake-off shows no loss.
[presets.qwen_lite]
description = "Qwen-Image-2.1 with the fp8 text encoder (less RAM): text-to-image and edits"
model = "Qwen-Image 2.1 (fp8 encoder)"
workflow = "qwen_image_21_t2i.json"
edit_workflow = "qwen_image_21_edit.json"
download = "qwen3vl-8b-fp8.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_fp8_scaled.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
width = 1024
height = 1024
resolution = 1024
steps = 25
cfg = 1.0
