# Opt-in model presets: `download` names the script in models/ that fetches their models (gen doctor
# shows them as warn until then). Presets that load a diffusion model (`unet`) have no img2img/inpaint
# (gen vary) unless they name an img2img_workflow / inpaint_workflow.

# SDXL finetune for the text-to-image bake-off (#51). One checkpoint file, so no new nodes.
# Models are opt-in (~6.9 GB, CreativeML Open RAIL++-M): run ~/imagegen/models/dreamshaper-xl-lightning.sh once.
# Lightning is distilled: 4-8 steps at cfg ~2 with DPM++ SDE Karras. gen vary on it uses the SDXL img2img graph
# (dpmpp_2m), which is not what Lightning is tuned for.
[presets.dreamshaper]
description = "DreamShaper XL Lightning (SDXL finetune, 6 steps): illustration-friendly, natural-language prompts"
model = "DreamShaper XL Lightning"
ref_preset = "dreamshaper_ref"
workflow = "sdxl_lightning.json"
download = "dreamshaper-xl-lightning.sh"
checkpoint = "DreamShaperXL_Lightning.safetensors"
width = 1024
height = 1024
steps = 6
cfg = 2.0
suffix = ""

# SDXL + IP-Adapter (#51): an SDXL model draws the character in a ref image into a new scene. Edit-only
# (gen edit REF "scene" -p sdxl_ref); `ref_preset` on draft/dreamshaper points the bake-off's ref test here.
# Opt-in: ~/imagegen/models/ipadapter-sdxl.sh (~3.4 GB) + the ComfyUI_IPAdapter_plus node (see that script).
# ipadapter_weight: how strongly the ref steers (higher = closer to the ref, less to the prompt).
# ipadapter_end: the share of the steps it steers; the rest follow the prompt alone, so the scene can take over.
# First tulu run (0.8, whole run): SDXL copied the ref's white sticker background and drew no scene.
[presets.sdxl_ref]
description = "SDXL base + IP-Adapter: the character in a ref image in a new scene: gen edit REF \"scene\" -p sdxl_ref"
model = "SDXL base 1.0 + IP-Adapter"
edit_workflow = "sdxl_ipadapter.json"
download = "ipadapter-sdxl.sh"
checkpoint = "sd_xl_base_1.0.safetensors"
ipadapter_model = "ip-adapter-plus_sdxl_vit-h.safetensors"
clip_vision = "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
ipadapter_weight = 0.55
ipadapter_end = 0.7
ref_negative = "white background, plain background, simple background, isolated, sticker, border, blurry, low quality, watermark, text, multiple characters"
steps = 25
cfg = 7.0

[presets.dreamshaper_ref]
description = "DreamShaper XL Lightning + IP-Adapter: gen edit REF \"scene\" -p dreamshaper_ref"
model = "DreamShaper XL Lightning + IP-Adapter"
edit_workflow = "sdxl_lightning_ipadapter.json"
download = "ipadapter-sdxl.sh"
checkpoint = "DreamShaperXL_Lightning.safetensors"
ipadapter_model = "ip-adapter-plus_sdxl_vit-h.safetensors"
clip_vision = "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
ipadapter_weight = 0.55
ipadapter_end = 0.7
ref_negative = "white background, plain background, simple background, isolated, sticker, border, blurry, low quality, watermark, text, multiple characters"
steps = 6
cfg = 2.0

# Edit-only preset: `gen edit IMAGE "instruction"` / MCP edit. Not usable for gen "prompt" or gen vary.
# Models are opt-in (~17.7 GB): run ~/imagegen/models/flux-kontext.sh once.
# FLUX.1 Kontext [dev] is under the FLUX.1 [dev] non-commercial licence.
[presets.kontext]
description = "Edit an image by instruction (FLUX.1 Kontext dev, fp8): gen edit IMAGE \"...\""
model = "FLUX.1 Kontext dev"
edit_workflow = "flux_kontext.json"
download = "flux-kontext.sh"
unet = "flux1-dev-kontext_fp8_scaled.safetensors"
clip_l = "clip_l.safetensors"
t5 = "t5xxl_fp8_e4m3fn_scaled.safetensors"
vae = "ae.safetensors"
steps = 20
guidance = 2.5

# Bake-off candidates (#40): text-to-image and edit in one preset each. Compare with `gen bakeoff`.
# FLUX.2 [klein] 4B distilled, fp8 (~11.9 GB, Apache 2.0): ~/imagegen/models/flux2-klein.sh
[presets.klein]
description = "FLUX.2 klein 4B (fp8, 4 steps): text-to-image, and gen edit IMAGE \"...\" -p klein"
model = "FLUX.2 klein 4B"
workflow = "flux2_klein_t2i.json"
edit_workflow = "flux2_klein_edit.json"
download = "flux2-klein.sh"
unet = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"
width = 1024
height = 1024
steps = 4

# A 16:9 4K wallpaper that draws the character from a reference image (klein models, as above). The scene
# comes from the prompt; the ref only shows the character, so it stays on-model. gen daily uses it.
# By hand: gen edit REF.png "lil tulu reading in a rainy window nook, only one character" -p wallpaper_ref
[presets.wallpaper_ref]
description = "16:9 wallpaper (4K) of the character in a ref image (Qwen-Image 2.1): gen edit REF \"scene\" -p wallpaper_ref"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "Qwen-Image 2.1"
edit_workflow = "qwen_image_21_ref_upscale.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1152              # Qwen draws at the ref's size within this pixel budget: 1152 on 16:9 = 1536x864
steps = 25
cfg = 1.0
# The ref is fitted onto a 16:9 canvas of its own background colour first: Qwen only draws at the ref's
# aspect (any other latent size breaks the edit: a blank image on tulu), and a portrait ref would crop badly.
ref_canvas = [1536, 864]
upscale_model = "RealESRGAN_x4plus.pth"
target_width = 3840
target_height = 2160

# #52, scene first, then cast: Qwen draws the 16:9 scene from the prompt, then a Qwen edit puts the characters
# from the ref images into it (image 1 = the scene, images 2.. = one ref per character) and the 4x upscale.
# One ComfyUI job, the model loaded once; about twice wallpaper's time. The scene is kept as NN-seedS-scene.png.
# gen "a taco truck on the moon, ..." -p wallpaper_cast --ref tulu.png [--ref cat.png] [--cast-prompt "..."]
[presets.wallpaper_cast]
description = "16:9 wallpaper (4K): a scene from text, then the characters from --ref images put into it (Qwen-Image 2.1)"
styles = ["synthwave"]           # the house look ([styles] below), for the scene; gen --style none for a plain one
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_scene_cast_upscale.json"
# Only the cast pass, on a finished scene (no upscale): gen edit 01-seedS-scene.png "Replace ..." -p wallpaper_cast --ref REF
edit_workflow = "qwen_image_21_cast_edit.json"
ref_canvas = [1536, 864]         # gen edit: the scene goes in at its own 16:9 size
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
resolution = 1024
steps = 25
cfg = 1.0
width = 1536                     # exactly 16:9 (multiples of 16), so the 4K scale crops nothing
height = 864
cast_resolution = 1152           # the edit draws at image 1's (the scene's) shape: 1152 on 16:9 = 1536x864
cast_steps = 25
target_width = 3840
target_height = 2160
upscale_model = "RealESRGAN_x4plus.pth"
suffix = ", wallpaper, wide landscape composition, highly detailed"
# The edit's instruction when none is given ({images} = "image 2" / "images 2 and 3"); gen daily writes its own.
cast_prompt = "Put the characters from {images} into the scene from image 1, each exactly once, as a natural part of the scene: doing something that fits it, at a size that fits the scene, lit like the scene. Each character keeps exactly the design, colours and proportions of its reference image, in a new pose. Keep everything else in image 1 the same: layout, background, lighting, colours and any text."

# The daily wallpaper before #51: klein draws the ref's character (~20 s, but less polished than Qwen).
[presets.wallpaper_ref_klein]
description = "16:9 wallpaper (4K) of the character in a ref image (FLUX.2 klein: fast): gen edit REF \"scene\" -p wallpaper_ref_klein"
styles = ["synthwave"]           # the house look ([styles] below); gen --style none for a plain one
model = "FLUX.2 klein 4B"
edit_workflow = "flux2_klein_ref_upscale.json"
download = "flux2-klein.sh"
unet = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"
out_width = 1536                # exactly 16:9 (and multiples of 16), so the 4K scale crops nothing
out_height = 864
steps = 16                      # klein is tuned for 4, but 16 gave far fewer quirks on tulu (8: many small ones)
upscale_model = "RealESRGAN_x4plus.pth"
target_width = 3840
target_height = 2160

# Qwen-Image-2.1 7B (~30 GB of bf16 files, Qwen Research licence): ~/imagegen/models/qwen-image-2.1.sh
# weight_dtype loads the bf16 diffusion model as fp8 (half the VRAM). Not int8: int8 renders black here.
# resolution = the edit's pixel budget (1024 = ~1 MP; the model goes up to 2048). cfg 1 ignores the negative.
[presets.qwen]
description = "Qwen-Image-2.1 7B (fp8 at load): text-to-image, and gen edit IMAGE \"...\" -p qwen"
model = "Qwen-Image 2.1"
workflow = "qwen_image_21_t2i.json"
edit_workflow = "qwen_image_21_edit.json"
download = "qwen-image-2.1.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_bf16.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
width = 1024
height = 1024
resolution = 1024
steps = 25
cfg = 1.0

# #51: the same model with the fp8 Qwen3-VL text encoder (10.6 GB instead of 16 GB), so it fits in WSL's RAM
# without swapping (the bf16 one locked up Windows during a video). Becomes `qwen` if the bake-off shows no loss.
[presets.qwen_lite]
description = "Qwen-Image-2.1 with the fp8 text encoder (less RAM): text-to-image and edits"
model = "Qwen-Image 2.1 (fp8 encoder)"
workflow = "qwen_image_21_t2i.json"
edit_workflow = "qwen_image_21_edit.json"
download = "qwen3vl-8b-fp8.sh"
unet = "qwen_image_2.1_bf16.safetensors"
weight_dtype = "fp8_e4m3fn"
text_encoder = "qwen3vl_8b_fp8_scaled.safetensors"
vae = "qwen_image_2.1_vae_bf16.safetensors"
width = 1024
height = 1024
resolution = 1024
steps = 25
cfg = 1.0

# Character stages (#68, first iteration; docs/character-stages.md). A character is in one stage at a time
# (gen char set NAME --stage converge); its projects' boards get one Generate button per stage, and
# `gen project gen SLUG --stage [S]` runs one. Stage passes use the stage's preset (not the project's preset/params).
# mode: text = cast descriptions + project prompt; edit = an edit preset changes one image (the selected board
# image, else the character's first ref); img2img = like edit but with `strength` (needs an img2img preset).
# instruction: the edit prompt; {text} = what you type on the board, else one of `ideas` per image
# (each new pass moves on along the list). needs_text: the stage won't run without typed text.
[stages.explore]
mode = "text"
preset = "klein"              # tapir test 2026-11-18: 8/8 klein drafts read as the animal asked for, SDXL draft
                              # drew pigs, cows and anteaters; qwen also good but ~5 min an image
count = 8

[stages.converge]
mode = "edit"
preset = "klein"
count = 4
instruction = "The same character with the same design, proportions and colours, {text}. Plain light background, only this one character."
ideas = ["sitting down", "waving hello", "seen from the side", "a three-quarter view",
         "jumping happily", "looking surprised", "walking towards the viewer", "sleeping"]

[stages.polish]
mode = "edit"
preset = "klein"
count = 2
needs_text = true             # one targeted fix per pass, typed on the board
instruction = "{text}. Keep everything else exactly the same: the same character, pose, colours and background."
